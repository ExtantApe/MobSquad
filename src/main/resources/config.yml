# MobSquad: coax mobs into critters that follow you.

# Worlds where MobSquad is off, by folder name: no coaxing, and critters can't be sent out there. An adventure world
# can be listed here.
disabled-worlds: []

# Real minutes a tuckered-out critter rests in the Bunkhouse before it can go out again.
recovery-minutes: 5

# Wranglin' experience for coaxing a critter.
coax-xp: 100

# Magic worlds, by folder name: the only places critters show their spirit coats. Empty means coats show nowhere, and
# critters look normal. Coats are still earned, chosen and listed in the journal. Leaving a magic world removes the look
# at once; entering one applies it. Each coat's name, color, particle and variants are in coats.yml.
# no-glow-worlds: magic worlds where coats show without the glow outline. The outline shows through walls, so it can
# lead other players to where a critter's owner is building. Critters there still wear their variant and leave their
# coat's trail. List kids' worlds here.
spirit-coats:
  worlds: []
  no-glow-worlds: []

# Quest chapters (0.9.0). How a player's tiers open:
#   level   Wranglin' level only (the default, as before quests).
#   either  the level, or sooner when a quest runs /mobsquad unlock <player> <tier>.
#   quest   only a quest opens Holler, Yonder and Backcountry. Yard is always open.
# Quests (BetonQuest's command event, or any quest plugin) can also run /mobsquad page <player> <critter> to open a
# journal page, and with PlaceholderAPI check %mobsquad_level%, %mobsquad_tier_yonder%, %mobsquad_has_fox% and the
# others listed in the README.
quests:
  tier-unlock: level
