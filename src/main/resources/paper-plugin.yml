name: MobSquad
version: '${version}'
main: com.extantape.mobsquad.MobSquadPlugin
api-version: '26.1'
description: "Coax mobs into critters that follow you, fight only hostile mobs and level up. Gotta coax em all... Pokemob!"
website: https://github.com/ExtantApe/MobSquad
# Commands are registered with Brigadier in code, so there is no commands section.
permissions:
  mobsquad.use:
    description: Coax critters, use Bunkhouses and the dinnerbell.
    default: true
  mobsquad.admin:
    description: Mark Bunkhouses and use /mobsquad admin commands.
    default: op
