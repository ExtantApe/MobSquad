name: MobSquad
version: '${version}'
main: com.extantape.mobsquad.MobSquadPlugin
api-version: '26.1'
description: "Coax mobs into critters that follow you, fight only hostile mobs and rest in a Bunkhouse. Gotta coax em all... Pokemob!"
website: https://github.com/ExtantApe/MobSquad
# Optional: with AuraSkills installed, Wranglin' is an AuraSkills skill. With PlaceholderAPI, quests can check
# %mobsquad_...% placeholders.
dependencies:
  server:
    AuraSkills:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
# Commands are registered with Brigadier in code, so there is no commands section.
permissions:
  mobsquad.use:
    description: Coax critters, use Bunkhouses and the dinnerbell.
    default: true
  mobsquad.admin:
    description: Mark Bunkhouses and use /mobsquad admin commands.
    default: op
  auraskills.skill.wranglin:
    description: Earn Wranglin' in AuraSkills. AuraSkills checks this for each skill but doesn't declare it for skills other plugins add, so MobSquad does.
    default: true
